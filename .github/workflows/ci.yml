name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------- always-on gates (run on every PR, no code needed) ----------

  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          test -f docs/MASTER.md || (echo "docs/MASTER.md missing" && exit 1)
          test -f docs/01-prd.md || (echo "docs/01-prd.md missing" && exit 1)
          test -f docs/02-architecture-trd.md || (echo "docs/02-architecture-trd.md missing" && exit 1)
          test -f docs/04-api-contract.md || (echo "docs/04-api-contract.md missing" && exit 1)
          test -f docs/05-uiux-spec.md || (echo "docs/05-uiux-spec.md missing" && exit 1)
          test -f docs/06-engineering-rules.md || (echo "docs/06-engineering-rules.md missing" && exit 1)
          test -f docs/07-execution-plan.md || (echo "docs/07-execution-plan.md missing" && exit 1)
          test -f docs/11-toolchain.md || (echo "docs/11-toolchain.md missing" && exit 1)
      - name: Docs cap (8, one-in-one-out)
        run: |
          n=$(git ls-files 'docs/*.md' | wc -l)
          echo "docs/ contains $n files (cap: 8)"
          test "$n" -le 8 || (echo "FAIL: docs/ over cap — merge or remove a doc first" && exit 1)

  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: File-placement law
        run: bash scripts/check-file-placement.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Scan codebase for secrets
        run: gitleaks detect --source . --verbose --redact

  # ---------- code gates (auto-skip until Week 1 Day 3 scaffold lands) ----------

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            code:
              - 'web/**'
              - 'api/**'
              - 'packages/**'
              - 'prisma/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'tsconfig*.json'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: |
          if [ -f web/.eslintrc.json ] || [ -f eslint.config.js ]; then
            pnpm lint
          else
            echo "eslint config lands Week 1 Day 3 — skipping until then"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: |
          if ls tsconfig*.json >/dev/null 2>&1 || ls */tsconfig*.json >/dev/null 2>&1; then
            pnpm typecheck
          else
            echo "tsconfig lands Week 1 Day 3 — skipping until then"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: |
          if git ls-files '*.test.ts' '*.test.tsx' | grep -q .; then
            pnpm test
          else
            echo "no test files yet — first ones land with payments logic (Week 5-6)"
          fi

  boundaries:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Module boundaries (dependency-cruiser)
        run: pnpm boundaries
      - name: Toolchain Delta Gate
        run: pnpm toolchain-delta
